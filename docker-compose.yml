
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: countries-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
    volumes:
      - ./backend/database/database.sqlite:/var/www/database/database.sqlite
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: countries-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
